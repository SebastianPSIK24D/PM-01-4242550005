name: flutter_1
description: "A new Flutter project."
publish_to: 'none'

version: 1.0.0+1

environment:
  sdk: ^3.13.5

dependencies:
  flutter:
    sdk: flutter

  cupertino_icons: ^1.0.8

dev_dependencies:
  flutter_test:
    sdk: flutter

  flutter_lints: ^6.0.0


flutter:
  uses-material-design: true
  assets:
    - assets/images/myfoto.jpg
    - assets/images/digilib.jpg

  fonts:
    - family: Tinos
      fonts:
        - asset: assets/fonts/Tinos-Regular.ttf
        - asset: assets/fonts/Tinos-Bold.ttf
          weight: 700